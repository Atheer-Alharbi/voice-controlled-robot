<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Gemini Voice Assistant</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="app">

    <header class="header">
        <div class="bot-avatar">🤖</div>

        <div>
            <h1>Gemini Assistant</h1>
            <p id="statusText">اضغط على الميكروفون وابدأ الحديث</p>
        </div>
    </header>


    <main id="chatLog" class="chat-log">

        <div class="message bot">
            <p>مرحبًا! 👋 أنا مساعدك الذكي. تحدث معي بالعربية.</p>
        </div>

    </main>


    <div class="controls">

        <button id="micBtn" class="mic-btn">
            <span id="micIcon">🎤</span>
        </button>

        <div class="hint">
            اضغط وتحدث
        </div>

    </div>

</div>

<script src="app.js"></script>

</body>
</html>
